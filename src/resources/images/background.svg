<svg width="48px" height="48px" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0.2" stdDeviation="0.4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer dark border -->
  <circle cx="5" cy="5" r="4.3"
      fill="none"
      stroke="#1a3c6e"
      stroke-width="0.5"/>

  <!-- White separation ring -->
  <circle cx="5" cy="5" r="4"
      fill="none"
      stroke="#2b60b0"
      stroke-width="0.5"/>

  <!-- Main fill -->
  <circle cx="5" cy="5" r="3.5"
      fill="#fcfcfcc0"
      filter="url(#shadow)"/>

</svg>